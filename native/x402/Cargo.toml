[package]
name = "x402"
version = "0.1.0"
edition = "2024"

[lib]
name = "x402"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.100"
rustler = "0.37.0"
tokio = {version = "1.48.0", features = ["full"]}
bundles_rs = {git = "https://github.com/loadnetwork/bundles-rs", branch = "main"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
reqwest = "0.12.24"
once_cell = "1.21.3"
